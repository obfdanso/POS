# Runs the whole POS (database, API, web app) with one command:
#   cp .env.docker.example .env      # then fill in the secrets
#   docker compose up --build
# The app is then at http://localhost:8080 (or APP_PORT).
# First run only, to load the sample data:
#   docker compose exec server npx prisma db seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pos_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos_db']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pos:${POSTGRES_PASSWORD}@db:5432/pos_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      # nginx in the client container is the one proxy in front of the API
      TRUST_PROXY: 1
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      # Leave unset (HTTPS-only cookies) unless tablets reach the app over plain HTTP on the shop network
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Optional emailed receipts (see server/.env.example)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SMS_COUNTRY_CODE: ${SMS_COUNTRY_CODE:-233}
      SMS_ALLOWED_COUNTRY_CODES: ${SMS_ALLOWED_COUNTRY_CODES:-}
      # Optional error reporting
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ready only once migrations have run and the API can reach the database
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  client:
    build:
      context: ./client
      args:
        VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
