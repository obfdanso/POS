server {
  listen 80;
  root /usr/share/nginx/html;

  # Product images can be up to 5 MB
  client_max_body_size 6m;

  # API, uploaded images, and seeded images come from the server container
  location ~ ^/(api|uploads|product-images)/ {
    proxy_pass http://server:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so browsers can cache them for good
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/pos, /reports, ...) all load the single-page app
  location / {
    try_files $uri /index.html;
  }
}
